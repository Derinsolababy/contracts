[package]
name = "shared"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
ed25519-dalek = { version = "2.0.0" }
curve25519-dalek = { version = "4.1.2" }
ethnum = { version = "1.5.3" }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
